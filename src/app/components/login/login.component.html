<div class="auth-container">
  <div class="card auth-card">
    <h2 class="text-center">Iniciar Sesión</h2>
    
    <div class="alert alert-danger" *ngIf="errorMensaje">
      {{ errorMensaje }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="ingresar()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" [class.is-invalid]="f['email'].invalid && f['email'].touched" placeholder="ejemplo@correo.com">
        <div class="error-msg" *ngIf="f['email'].invalid && f['email'].touched">
          Ingrese un correo válido.
        </div>
      </div>

      <div class="form-group mt-3">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" [class.is-invalid]="f['password'].invalid && f['password'].touched" placeholder="***">
        <div class="error-msg" *ngIf="f['password'].invalid && f['password'].touched">
          La contraseña es obligatoria.
        </div>
      </div>

      <div class="form-actions" style="justify-content: center; margin-top: 30px;">
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </div>
      
      <div class="text-center mt-3">
        <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
