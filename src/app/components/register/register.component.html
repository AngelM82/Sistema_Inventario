<div class="auth-container">
  <div class="card auth-card">
    <h2 class="text-center">Crear una Cuenta</h2>
    
    <div class="alert alert-danger" *ngIf="errorMensaje">
      {{ errorMensaje }}
    </div>
    <div class="alert alert-success" *ngIf="exitoMensaje" style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
      {{ exitoMensaje }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="registrar()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input id="nombre" type="text" formControlName="nombre" [class.is-invalid]="f['nombre'].invalid && f['nombre'].touched" placeholder="Tu nombre">
        <div class="error-msg" *ngIf="f['nombre'].invalid && f['nombre'].touched">
          Ingrese un nombre válido (mín. 3 caracteres).
        </div>
      </div>

      <div class="form-group mt-3">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" [class.is-invalid]="f['email'].invalid && f['email'].touched" placeholder="ejemplo@correo.com">
        <div class="error-msg" *ngIf="f['email'].invalid && f['email'].touched">
          Ingrese un correo válido.
        </div>
      </div>

      <div class="form-group mt-3">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" [class.is-invalid]="f['password'].invalid && f['password'].touched" placeholder="***">
        <div class="error-msg" *ngIf="f['password'].invalid && f['password'].touched">
          La contraseña debe tener al menos 6 caracteres.
        </div>
      </div>

      <div class="form-group mt-3">
        <label for="rol">Rol (Para pruebas)</label>
        <select id="rol" formControlName="rol">
          <option value="cliente">Cliente (Comprador)</option>
          <option value="admin">Encargado (Administrador)</option>
        </select>
      </div>

      <div class="form-actions" style="justify-content: center; margin-top: 30px;">
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
      </div>
      
      <div class="text-center mt-3">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
      </div>
    </form>
  </div>
</div>
